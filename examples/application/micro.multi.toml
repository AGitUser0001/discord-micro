# The same components spread over processes: `uv run micro up micro.multi.toml`
# Try `micro scale bot 3`, `micro roll greeter`, or `micro gateway shards 2`.
name = "example"
nats = "nats://127.0.0.1:4222"

[processes.gateway]
components = ["micro.gateway:GatewayWorker"]
replicas = 2

[processes.discord-http]
components = ["micro.discord:DiscordHTTPWorker"]
replicas = 2

[processes.greeter]
components = ["app:greeter"]
replicas = 2

[processes.bot]
components = ["app:bot", "app:audit"]

[processes.ticker]
components = ["app:ticker"]

[processes.interactions]
components = [
  "micro.discord.interactions:InteractionRouter",
  "micro.discord.interactions:CommandSync",
]
replicas = 2

[processes.http]
components = ["micro.http:HTTPBridge"]

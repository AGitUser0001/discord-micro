[project]
name = "Micro"
version = "0.1.0"
description = "Microservice-based Discord bot framework."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
authors = [
    { name = "AGitUser0001", email = "123198477+AGitUser0001@users.noreply.github.com" }
]
requires-python = ">=3.14"
keywords = ["discord"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "uvloop>=0.22.1; sys_platform == 'darwin' or sys_platform == 'linux'",
    "winloop>=0.6.3; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/AGitUser0001/discord-micro"
Repository = "https://github.com/AGitUser0001/discord-micro"
Issues = "https://github.com/AGitUser0001/discord-micro/issues"

[project.scripts]
micro = "micro:main"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.16.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
indent-width = 2

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
extend-select = ["I", "RUF022"]
ignore = ["B010", "BLE001"]
